<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comatozze — Image Gallery</title>
<style>
:root{color-scheme:dark;--bg:#0d0b11;--panel:#19151f;--line:#33283b;--muted:#b8adbf;--accent:#e2b6f4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#faf7fc;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{text-align:center;padding:42px 18px 30px;background:radial-gradient(ellipse at top,#392342,#0d0b11 75%)}
.eyebrow{color:var(--accent);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase}
h1{font-size:clamp(2rem,7vw,3.3rem);margin:10px 0}header p{max-width:650px;margin:auto;color:var(--muted);line-height:1.6}
main{width:min(1100px,calc(100% - 32px));margin:28px auto 50px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
input{flex:1;min-width:190px;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;color:white;font:inherit}
.count{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:17px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.card[hidden]{display:none}.image-link{display:block;cursor:zoom-in;background:#211c28}
.photo{width:100%;height:320px;display:block;object-fit:cover;transition:transform .25s}
.image-link:hover .photo{transform:scale(1.02)}
.details{padding:14px}.details h2{font-size:1rem;margin:0 0 6px}.details p{margin:0;color:var(--muted);font-size:.88rem}
footer{text-align:center;color:#81798a;padding:0 16px 28px;font-size:.82rem}
#viewer{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;padding:20px;z-index:5;cursor:zoom-out}
#viewer.open{display:flex}#viewer img{max-width:95vw;max-height:90vh;object-fit:contain;border-radius:8px}#close{position:absolute;top:16px;right:20px;font-size:2rem;color:white;background:#222;border:0;border-radius:50%;width:44px;height:44px;cursor:pointer}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Photo collection</div>
  <h1>Comatozze</h1>
  <p>A dark, responsive gallery featuring the two pictures you provided. Select an image to view it larger.</p>
</header>
<main>
  <div class="toolbar">
    <input id="search" type="search" placeholder="Search images…" aria-label="Search images">
    <span id="count" class="count">2 images</span>
  </div>
  <section class="grid" id="gallery">
    <article class="card" data-search="comatozze photo 1 portrait">
      <a class="image-link" href="images/comatozze-photo-1.jpeg" data-full="images/comatozze-photo-1.jpeg">
        <img class="photo" src="images/comatozze-photo-1.jpeg" alt="Comatozze photo 1" loading="eager">
      </a>
      <div class="details"><h2>Photo 01</h2><p>Tap the picture to enlarge.</p></div>
    </article>
    <article class="card" data-search="comatozze photo 2 portrait profile">
      <a class="image-link" href="images/comatozze-photo-2.jpeg" data-full="images/comatozze-photo-2.jpeg">
        <img class="photo" src="images/comatozze-photo-2.jpeg" alt="Comatozze photo 2" loading="eager">
      </a>
      <div class="details"><h2>Photo 02</h2><p>Tap the picture to enlarge.</p></div>
    </article>
  </section>
</main>
<footer>Gallery made with the images provided by the user.</footer>
<div id="viewer" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button id="close" aria-label="Close image viewer">×</button>
  <img id="large" src="" alt="Enlarged photo">
</div>
<script>
const search=document.getElementById('search'),cards=[...document.querySelectorAll('.card')],count=document.getElementById('count');
search.addEventListener('input',()=>{let n=0;const q=search.value.trim().toLowerCase();cards.forEach(c=>{const show=(c.dataset.search+' '+c.innerText).toLowerCase().includes(q);c.hidden=!show;if(show)n++});count.textContent=`${n} image${n===1?'':'s'}`});
const viewer=document.getElementById('viewer'),large=document.getElementById('large');
document.querySelectorAll('.image-link').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();large.src=link.dataset.full;viewer.classList.add('open')}));
function closeViewer(){viewer.classList.remove('open');large.src=''}
document.getElementById('close').addEventListener('click',closeViewer);
viewer.addEventListener('click',e=>{if(e.target===viewer)closeViewer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});
</script>
</body>
</html>
